<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0810; color: #efeaf4; min-height: 100vh; display: flex; align-items: center;
  justify-content: center; font: 15px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
  background-image: radial-gradient(900px 460px at 80% -5%, rgba(255,47,109,.12), transparent 60%); }
.card { width: min(360px, 92vw); background: #16121e; border: 1px solid #2a2338; border-radius: 16px;
  padding: 30px 26px; }
.club { color: #f0c34e; letter-spacing: .14em; font-size: 11px; font-weight: 700; }
h1 { font-size: 22px; margin: 6px 0 18px; font-weight: 800; }
h1 em { font-style: normal; color: #ff2f6d; }
input[type=password] { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2338;
  background: #0f0c16; color: #efeaf4; font-size: 16px; outline: none; }
input[type=password]:focus { border-color: #ff2f6d; }
label.rem { display: flex; gap: 8px; align-items: center; margin: 14px 0; color: #9b93a8; font-size: 13px; }
button { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #ff2f6d; color: #fff;
  font-size: 15px; font-weight: 700; cursor: pointer; }
button:disabled { opacity: .55; }
.err { color: #e8637c; font-size: 13px; margin-top: 10px; min-height: 18px; }
.shake { animation: sh .35s; }
@keyframes sh { 20% { transform: translateX(-6px); } 60% { transform: translateX(6px); } }
</style>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function tryOpen(pw, silent) {
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; err.textContent = silent ? "" : "Расшифровываю…";
  try {
    const raw = b64(BLOB), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256"},
      km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, ct);
    if (document.getElementById("rem").checked) localStorage.setItem("pulse_pw", pw);
    const html = new TextDecoder().decode(plain);
    document.open(); document.write(html); document.close();
  } catch (e) {
    btn.disabled = false;
    if (!silent) {
      err.textContent = "Пароль не подошёл";
      document.getElementById("f").classList.add("shake");
      setTimeout(() => document.getElementById("f").classList.remove("shake"), 400);
    } else { err.textContent = ""; }
  }
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault(); tryOpen(document.getElementById("pw").value, false);
});
const saved = localStorage.getItem("pulse_pw");
if (saved) { document.getElementById("pw").value = saved; tryOpen(saved, true); }
